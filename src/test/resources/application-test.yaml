spring:
  datasource:
    url: jdbc:h2:mem:meeting_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false
      fail-fast: false

eureka:
  client:
    enabled: false

app:
  gateway:
    internal-token: test-gateway-token
    trust-check-enabled: false
    public-url: /
  kafka:
    enabled: false
    created-topic: planwith.meeting.created
    completed-topic: planwith.meeting.completed
    disbanded-topic: planwith.meeting.disbanded
    participation-changed-topic: planwith.meeting.participation.changed
    updated-topic: planwith.meeting.updated
    vice-host-changed-topic: planwith.meeting.vice-host.changed

management:
  health:
    diskspace:
      enabled: false
    kafka:
      enabled: false
