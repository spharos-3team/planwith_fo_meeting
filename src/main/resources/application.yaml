spring:
  application:
    name: planwith-fo-meeting
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/meeting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:meeting_user}
    password: ${DB_PASSWORD:meeting_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 500
        request.timeout.ms: 500
        delivery.timeout.ms: 1500
        socket.connection.setup.timeout.ms: 500
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 500
        default.api.timeout.ms: 500
    listener:
      auto-startup: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8086}
  shutdown: graceful

eureka:
  client:
    # Docker/AWS 기본 on. 로컬 단독은 .env에서 EUREKA_CLIENT_ENABLED=false
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: ${MEETING_KAFKA_ENABLED:false}

app:
  gateway:
    public-url: ${GATEWAY_PUBLIC_URL:/}
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
    trust-check-enabled: ${GATEWAY_TRUST_CHECK_ENABLED:false}
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-meeting-deploy-v1}
  kafka:
    enabled: ${MEETING_KAFKA_ENABLED:false}
    created-topic: ${MEETING_TOPIC_CREATED:planwith.meeting.created}
    completed-topic: ${MEETING_TOPIC_COMPLETED:planwith.meeting.completed}
    disbanded-topic: ${MEETING_TOPIC_DISBANDED:planwith.meeting.disbanded}
    participation-changed-topic: ${MEETING_TOPIC_PARTICIPATION_CHANGED:planwith.meeting.participation.changed}
    updated-topic: ${MEETING_TOPIC_UPDATED:planwith.meeting.updated}
    vice-host-changed-topic: ${MEETING_TOPIC_VICE_HOST_CHANGED:planwith.meeting.vice-host.changed}
