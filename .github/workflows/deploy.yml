name: Deploy planwith-fo-meeting

on:
  push:
    branches: [develop]
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: [self-hosted, planwith-server]
    defaults:
      run:
        # Windows self-hosted: cmd avoids bash path bugs and PowerShell ExecutionPolicy blocks
        shell: cmd

    env:
      IMAGE_NAME: planwith/planwith-fo-meeting
      IMAGE_TAG: latest
      COMPOSE_FILE: C:/planwith/docker-compose.yml
      SERVICE_NAME: planwith-fo-meeting

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: powershell
        run: |
          $image = "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          $ok = $false
          foreach ($n in 1..3) {
            Write-Host "docker build attempt $n"
            docker build -t $image .
            if ($LASTEXITCODE -eq 0) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { exit 1 }

      - name: Stop existing container
        continue-on-error: true
        run: |
          docker compose -f "${{ env.COMPOSE_FILE }}" stop "${{ env.SERVICE_NAME }}"
          docker compose -f "${{ env.COMPOSE_FILE }}" rm -f "${{ env.SERVICE_NAME }}"

      - name: Start service container
        # --no-deps: do not start/pull discovery etc. (local planwith/* images only)
        # --pull never: never hit Docker Hub for planwith/* tags
        run: docker compose -f "${{ env.COMPOSE_FILE }}" up -d --no-deps --pull never "${{ env.SERVICE_NAME }}"

      - name: Show running containers
        run: docker compose -f "${{ env.COMPOSE_FILE }}" ps

      - name: Prune unused images
        run: docker image prune -f
